<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - Pasar Nusa</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
      }
      td,
      th {
        padding: 0.5rem;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: middle;
      }
      td input[type="number"] {
        width: 7rem;
      }
      .th {
        width: 56px;
        height: 56px;
        object-fit: cover;
        border-radius: 6px;
        background: #e4ece8;
        display: grid;
        place-items: center;
        font-size: 1.8rem;
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <a class="brand" href="/">Pasar Nusa</a>
      <nav><span>Panel admin</span></nav>
    </header>
    <main>
      <p id="msg" class="err" role="alert"></p>
      <div style="overflow-x: auto">
        <table>
          <thead>
            <tr>
              <th>Foto</th>
              <th>Produk</th>
              <th>Harga (Rp)</th>
              <th>Stok</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
    <script src="admin.js"></script>
  </body>
</html>
