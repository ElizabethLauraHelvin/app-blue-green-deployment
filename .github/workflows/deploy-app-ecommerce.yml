
name: Deploy App Ecommerce

on:
  push:
    branches:
      - main
    paths:
      - 'ecommerce-app/backend/**'
      - 'ecommerce-app/frontend/**'
      - 'ecommerce-app/k8s/**'
      - 'ecommerce-app/infrastucture/**'
      - 'ecommerce-app/infrastructure/**'
      - '.github/workflows/deploy-app-ecommerce.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-app-ecommerce
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Push and Deploy
    runs-on: [self-hosted, Linux, X64]

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: v.${{ github.run_number }}
      NAMESPACE: ecommerce
      CLUSTER: bluegreen-cluster

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. CHECK KUBERNETES
      # ==========================================

      - name: Check Kubernetes Connection
        run: |
          set -e

          kubectl config use-context "k3d-${CLUSTER}"

          kubectl cluster-info

          kubectl get nodes

      # ==========================================
      # 3. VERIFY DOCKER HUB SECRETS
      # ==========================================

      - name: Verify Docker Hub Credentials
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "ERROR: DOCKERHUB_USERNAME is missing"
            exit 1
          fi

          echo "Docker Hub username configured."

      # ==========================================
      # 4. SETUP DOCKER BUILDX
      # ==========================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # 5. LOGIN DOCKER HUB
      # ==========================================

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ==========================================
      # 6. BUILD BACKEND IMAGE
      # ==========================================

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./ecommerce-app/backend
          file: ./ecommerce-app/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-app-backend:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-app-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ==========================================
      # 7. BUILD FRONTEND IMAGE
      # ==========================================

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./ecommerce-app/frontend
          file: ./ecommerce-app/frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-app-frontend:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-app-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ==========================================
      # 8. CREATE KUBERNETES NAMESPACE
      # ==========================================

      - name: Prepare Kubernetes Namespace
        run: |
          kubectl apply -f ecommerce-app/k8s/namespace.yaml

      # ==========================================
      # 9. CREATE JWT SECRET
      # ==========================================

      - name: Prepare JWT Secret
        run: |
          if ! kubectl get secret ecommerce-secret \
            -n "$NAMESPACE" >/dev/null 2>&1; then

            kubectl create secret generic ecommerce-secret \
              -n "$NAMESPACE" \
              --from-literal=JWT_SECRET="$(openssl rand -hex 32)"

            echo "JWT Secret created."

          else
            echo "JWT Secret already exists. Keeping existing secret."
          fi

      # ==========================================
      # 10. PREPARE PERSISTENT STORAGE
      # ==========================================

      - name: Prepare Persistent Storage
        run: |
          kubectl apply -f ecommerce-app/k8s/storage.yaml

          kubectl wait \
            --for=jsonpath='{.status.phase}'=Bound \
            pvc/ecommerce-data-pvc \
            -n "$NAMESPACE" \
            --timeout=180s

      # ==========================================
      # 11. PREPARE APPLICATION MANIFEST
      # ==========================================

      - name: Prepare Application Manifest
        run: |
          sed \
            -e "s|__DOCKERHUB_USERNAME__|${DOCKERHUB_USERNAME}|g" \
            -e "s|__BACKEND_TAG__|${IMAGE_TAG}|g" \
            -e "s|__FRONTEND_TAG__|${IMAGE_TAG}|g" \
            ecommerce-app/k8s/app.yaml > /tmp/ecommerce-app.yaml

          echo "===== GENERATED IMAGE REFERENCES ====="

          grep "image:" /tmp/ecommerce-app.yaml

      # ==========================================
      # 12. DEPLOY APPLICATION
      # ==========================================

      - name: Deploy Application to Kubernetes
        run: |
          set -e

          echo "======================================"
          echo "DEPLOY ECOMMERCE APPLICATION"
          echo "======================================"

          echo "Image version: ${IMAGE_TAG}"

          kubectl apply -f /tmp/ecommerce-app.yaml

          kubectl apply -f ecommerce-app/k8s/ingress.yaml

      # ==========================================
      # 13. VERIFY BACKEND
      # ==========================================

      - name: Verify Backend Rollout
        run: |
          kubectl rollout status deployment/backend \
            -n "$NAMESPACE" \
            --timeout=180s

      # ==========================================
      # 14. VERIFY FRONTEND
      # ==========================================

      - name: Verify Frontend Rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n "$NAMESPACE" \
            --timeout=180s

      # ==========================================
      # 15. VERIFY DEPLOYMENT
      # ==========================================

      - name: Verify Kubernetes Resources
        run: |
          echo "===== PODS ====="
          kubectl get pods -n "$NAMESPACE" -o wide

          echo "===== DEPLOYMENTS ====="
          kubectl get deployments -n "$NAMESPACE"

          echo "===== SERVICES ====="
          kubectl get services -n "$NAMESPACE"

          echo "===== PVC ====="
          kubectl get pvc -n "$NAMESPACE"

          echo "===== DEPLOYED IMAGES ====="
          kubectl get deployments -n "$NAMESPACE" \
            -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.spec.template.spec.containers[0].image}{"\n"}{end}'

          echo "======================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "======================================"

      # ==========================================
      # 16. LOGOUT DOCKER HUB
      # ==========================================

      - name: Logout Docker Hub
        if: always()
        run: docker logout || true
