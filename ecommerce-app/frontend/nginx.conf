server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 3m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

  location /api/     { proxy_pass http://backend:3000; include /etc/nginx/proxy_params; }
  location /uploads/ { proxy_pass http://backend:3000; include /etc/nginx/proxy_params; }
  location / { try_files $uri $uri/ =404; }
}
